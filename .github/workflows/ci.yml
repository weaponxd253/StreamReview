name: CI

# Runs manually from the Actions tab for now. GitHub has been refusing to start jobs on
# this account (they fail in seconds with no logs), which put a red X on every commit.
# Once Actions billing/limits are sorted, add `push:` and `pull_request:` back under `on:`.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: TZ=America/New_York npm test
